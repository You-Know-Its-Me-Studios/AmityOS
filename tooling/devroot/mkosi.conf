# Build environment for the AmityOS crates: the same Ubuntu release as the image,
# with the development packages of the libraries the compositor, shell and
# apps link against. It is a directory tree entered with tooling/dev.sh; it is
# not part of the product image, and nothing is installed into WSL itself.

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=universe

[Output]
ImageId=amityos-devroot
Format=directory

[Build]
Incremental=no

[Content]
Bootable=no
WithDocs=no
Locale=C.UTF-8

Packages=
        # Toolchain support (rustc and cargo come from the pinned toolchain in .deps/)
        build-essential
        pkg-config
        ca-certificates
        git
        curl
        # Wayland compositor (Smithay)
        libwayland-dev
        wayland-protocols
        libxkbcommon-dev
        libudev-dev
        libinput-dev
        libseat-dev
        libdrm-dev
        libgbm-dev
        libegl-dev
        libgles-dev
        libpixman-1-dev
        libsystemd-dev
        libdisplay-info-dev
        # Shell and apps (iced, fonts, D-Bus)
        libfontconfig-dev
        libfreetype-dev
        libdbus-1-dev
        libvulkan-dev
        # Running and inspecting things inside the build root
        apt
        libgl1-mesa-dri
        libegl-mesa0
        libgles2
        mesa-vulkan-drivers
        xwayland
        xkb-data
        foot
        wayland-utils
        fonts-inter
        fonts-jetbrains-mono
