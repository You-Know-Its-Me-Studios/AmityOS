# AmityOS base image. Built by tooling/image_build.sh with the pinned mkosi in .deps/.
# Base: Ubuntu 26.04 LTS (resolute), HWE kernel. Decision: docs/decisions/0002.

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=universe
             restricted
             multiverse

[Output]
ImageId=amityos
ImageVersion=0.1.0
Format=disk
ManifestFormat=json

[Build]
# Build tools (systemd-repart, ukify, mkfs.*, apt) come from a tools tree, not
# from the WSL host, so the result does not depend on host packages.
ToolsTree=yes
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=resolute
Incremental=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=auto
Hostname=amityos
Locale=en_US.UTF-8
Timezone=UTC
Keymap=us
WithDocs=no
KernelCommandLine=rw quiet splash

Packages=
        # Kernel, firmware, boot
        linux-image-generic-hwe-26.04
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-repart
        systemd-resolved
        systemd-timesyncd
        udev
        kmod
        btrfs-progs
        dosfstools
        # Base userland (login is no longer installed by default in 26.04; it
        # provides /bin/login and /etc/pam.d/login, which the session unit uses)
        login
        passwd
        util-linux
        procps
        psmisc
        file
        xz-utils
        zstd
        unzip
        openssh-client
        wpasupplicant
        rfkill
        apt
        ca-certificates
        curl
        gnupg
        sudo
        locales
        tzdata
        less
        nano
        bash-completion
        iproute2
        iputils-ping
        pciutils
        usbutils
        # Session plumbing
        dbus
        dbus-user-session
        libpam-systemd
        polkitd
        network-manager
        pipewire
        pipewire-pulse
        wireplumber
        xdg-desktop-portal
        xdg-user-dirs
        # Graphics
        libgl1-mesa-dri
        libegl1
        libgles2
        mesa-vulkan-drivers
        xwayland
        # Placeholder Wayland session until amity-comp (Phase 3)
        labwc
        foot
        grim
        wlr-randr
        # Fonts from the design system
        fonts-inter
        fonts-jetbrains-mono
        fonts-noto-core
        # Applications
        flatpak
