# Development image: serial console with a root shell for the test harness.
# Never ship an image built with this profile.
[Content]
# no_timer_check: this image runs in the QEMU/WHPX VM, where the interrupt
# controller is emulated in QEMU (kernel-irqchip=off). Under host load Linux's
# boot-time check of the timer interrupt occasionally fails there and the
# guest panics ("IO-APIC + timer doesn't work"). Linux skips the check by
# itself on hypervisors it recognises; this one it does not. The option is not
# in the release image, where the check protects against broken firmware.
# (Passing it per VM through SMBIOS type 11 is not possible: the pinned QEMU
# 8.2.0 Windows build crashes on any "-smbios type=11" option.)
KernelCommandLine=console=tty0 console=ttyS0,115200 no_timer_check
