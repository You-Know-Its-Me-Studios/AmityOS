[workspace]
members = ["crates/*", "apps/*"]
# Patched third-party crates (see [patch.crates-io] below) are not workspace members.
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "LicenseRef-AmityOS-Proprietary"
publish = false

# Versions used by more than one crate. Exact versions are pinned in Cargo.lock.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = "line-tables-only"

# softbuffer 0.4.8 with a two-line change: Wayland buffers are created as
# ARGB8888 instead of XRGB8888, so that the software renderer can present
# translucent shell surfaces. Details and removal conditions:
# vendor/softbuffer/AMITYOS-PATCH.md
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }
